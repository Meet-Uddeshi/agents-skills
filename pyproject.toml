[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meet-ai-agents"
version = "1.0.0"
description = "Meet AI Agents - Enterprise Multi-Agent System, Dual Workflow Engine, and MCP Tool Calling Platform"
readme = "GEMINI.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Meet Uddeshi" }
]
keywords = ["agents", "multi-agent", "skills", "workflows", "antigravity", "mcp", "automation", "meet-ai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance"
]

[project.scripts]
meet-ai-agents = "bin.cli:main"
meet-ai = "bin.cli:main"
meet = "bin.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bin*"]

[tool.setuptools.package-data]
"*" = ["*.*"]

